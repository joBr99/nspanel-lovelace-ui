# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: NSPanel Lovelace UI Test
version: "4.7.92-test.1"
slug: nspanel-lovelace-ui
description: NSPanel Lovelace UI Addon
services:
  - "mqtt:want"
homeassistant_api: true
url: "https://github.com/joBr99/nspanel-lovelace-ui/tree/main/nspanel-lovelace-ui"
arch:
  - aarch64
  - amd64
init: false
map:
  - addon_config:rw
options:
  loglevel: DEBUG
  logtofile: false
schema:
  loglevel: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
  logtofile: bool


ingress: true
ingress_port: 8099
panel_icon: mdi:tablet-dashboard
panel_title: NSPanel
