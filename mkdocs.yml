# https://squidfunk.github.io/mkdocs-material/getting-started
# https://squidfunk.github.io/mkdocs-material/reference/admonitions
# https://github.com/squidfunk/mkdocs-material/blob/master/mkdocs.yml


site_name: NsPanel Lovelace UI Docs
site_description: Custom Firmware for NsPanel with the design of HomeAssistant's lovelace UI in mind, works with Tasmota.
site_author: Johannes Braun
site_url: https://jobr99.github.io/nspanel-lovelace-ui

repo_name: jobr99/nspanel-lovelace-ui
repo_url: https://github.com/jobr99/nspanel-lovelace-ui
edit_uri: ""

copyright: "Copyright &copy; 2026 Johannes Braun"

docs_dir: docs

theme:
    #logo: _assets/logo.png
    #favicon: _assets/favicon.ico
    name: material
    palette:
        accent: blue
    font:
        text: "arial, sans-serif"
        code: monospace
    features:
        - navigation.indexes
        - navigation.sections
        - navigation.top
        - navigation.tracking
        - navigation.expand
        - search.highlight
        - search.share
        - search.suggest
    custom_dir: docs/overrides

extra_css:
    - _assets/user.css

extra:
  analytics:
    provider: custom

markdown_extensions:
    - admonition
    - def_list
    - attr_list
    - pymdownx.tilde
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.magiclink
    - toc:
        permalink: true
    - codehilite:
        guess_lang: false
#    - markdown_include.include:
#        base_path: docs

plugins:
    - search:
        lang: en

nav:
    - "Overview": index.md
    - "Getting started (Home Assistant)":
        - "Prepare NSPanel": prepare_nspanel.md
        - "Install the add-on": prepare_ha.md
        - "Connect MQTT and add a panel": configure_mqtt.md
        - "Web editor": web-editor.md
        - "Import and migrate YAML": config-migration-standalone.md
    - "Configuration - panels.yaml":
        - "Overview": config-overview.md
        - "Cards": cards.md
        - "Screensaver": config-screensaver.md
        - "Entities and templates": entities.md
        - "Navigation and hidden cards": subpages.md
        - "Connection modes": connection-modes.md
    - "Help and development":
        - "FAQ": faq.md
        - "Configuration checklist": config-validation-checklist.md
        - "Troubleshooting": troubleshooting.md
        - "Test a branch": testing.md
        - "Standalone operation": standalone-runtime.md
    - "Legacy AppDaemon":
        - "Installation (historical)": legacy-prepare_ha.md
        - "MQTT and apps.yaml": legacy-configure_mqtt.md
        - "Configuration": legacy-config-overview.md
        - "Screensaver": legacy-config-screensaver.md
        - "Cards":
            - "Entities": card-entities.md
            - "Grid": card-grid.md
            - "Climate": card-climate.md
            - "Media": card-media.md
            - "Alarm": card-alarm.md
            - "QR": card-qr.md
            - "Power": card-power.md
            - "Unlock": card-unlock.md
        - "Entities": legacy-entities.md
        - "Subpages": legacy-subpages.md
        - "Notifications": notifications.md
        - "Physical buttons": phys-btn.md
        - "FAQ": legacy-faq.md
        - "Checklist": legacy-config-validation-checklist.md
        - "Troubleshooting": legacy-troubleshooting.md
    - "Getting started (ioBroker)":
        - "Prepare NSPanel": prepare_nspanel_ioBroker.md
        - "Prepare ioBroker": iobroker-install.md
